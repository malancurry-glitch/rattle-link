<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password - Rattle Link</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter, Arial, sans-serif;
  background:radial-gradient(circle at top,#020617,#000);
  color:#e2e8f0;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.wrapper{
  display:flex;
  width:800px;
  max-width:95%;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
  border:1px solid rgba(0,255,255,0.12);
}

.left{
  flex:1;
  background:linear-gradient(135deg,#3b82f6,#06b6d4);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  color:white;
  padding:24px;
}

.left p{
  max-width:260px;
  line-height:1.6;
  margin:0;
}

.card{
  flex:1;
  background:#020617;
  padding:30px;
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid rgba(0,255,255,0.2);
  background:#000;
  color:#0ff;
  outline:none;
}

input:focus{
  box-shadow:0 0 0 2px rgba(0,255,255,0.12);
}

button, a.btn-link{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#0ff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  display:block;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.secondary{
  margin-top:10px;
  background:transparent;
  border:1px solid rgba(0,255,255,0.2);
  color:#e2e8f0;
}

.msg{ margin-top:12px; font-size:13px; line-height:1.6; min-height:22px; }
.error{ color:#ef4444; }
.successText{ color:#22c55e; }
.warn{ color:#f59e0b; }

.backend{
  margin-top:10px;
  font-size:11px;
  color:#00ffff;
  border:1px solid rgba(0,255,255,0.2);
  padding:4px 8px;
  border-radius:999px;
  display:inline-block;
}

.helper{
  margin-top:14px;
  font-size:12px;
  color:#94a3b8;
  line-height:1.6;
}

.hidden{
  display:none !important;
}

@media (max-width: 760px){
  .wrapper{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="left">
    <h1>🐍 Rattle Link</h1>
    <p>Secure password reset across your hybrid auth flow.</p>
  </div>

  <div class="card">
    <h2>Reset Password</h2>

    <input id="password" type="password" placeholder="New Password" autocomplete="new-password">
    <input id="confirm" type="password" placeholder="Confirm Password" autocomplete="new-password">

    <button onclick="resetPassword()" id="btn">Reset Password</button>
    <a id="backBtn" class="btn-link secondary" href="index.html">Back to Login</a>

    <div id="msg" class="msg"></div>
    <div id="backend" class="backend hidden"></div>

    <div class="helper">
      Your backend requires at least 8 characters. This page keeps the email and backend in the return login link.
    </div>
  </div>
</div>

<script>
const PRIMARY_API = "https://rattleshortapi.it.com";
const LEGACY_API = "https://suvegwrmzl.execute-api.us-east-2.amazonaws.com/production";

const params = new URLSearchParams(window.location.search);
const token = (params.get("token") || "").trim();
const forcedBackend = (params.get("backend") || "").trim().toLowerCase();
const email = (params.get("email") || "").trim().toLowerCase();

const msgBox = document.getElementById("msg");
const btn = document.getElementById("btn");
const backendBox = document.getElementById("backend");
const backBtn = document.getElementById("backBtn");

/* ================= UI ================= */

function show(message, type="error"){
  msgBox.innerText = message;
  msgBox.className = "msg " + (type==="success" ? "successText" : type==="warn" ? "warn" : "error");
}

function showBackend(name){
  if(!name){
    backendBox.classList.add("hidden");
    return;
  }
  backendBox.classList.remove("hidden");
  backendBox.innerText = "Handled by " + (name==="primary" ? "Backend 2" : "AWS Legacy");
}

function normalize(url){
  return String(url || "").replace(/\/+$/, "");
}

function buildIndexHref(emailValue="", backendValue=""){
  const q = [];
  if(emailValue) q.push(`email=${encodeURIComponent(emailValue)}`);
  if(backendValue) q.push(`backend=${encodeURIComponent(backendValue)}`);
  return `index.html${q.length ? `?${q.join("&")}` : ""}`;
}

function updateBackLink(backendValue=""){
  backBtn.href = buildIndexHref(email, backendValue || forcedBackend || "");
}

/* ================= NETWORK ================= */

async function safeBody(res){
  const t = await res.text();
  if(!t) return {};
  try{ return JSON.parse(t); } catch { return {message:t}; }
}

async function callApi(base, path, options){
  try{
    const res = await fetch(normalize(base)+path, options);
    const data = await safeBody(res);
    return { ok:res.ok, status:res.status, data };
  }catch(e){
    return { ok:false, status:0, data:{message:e.message} };
  }
}

/* ================= 🔥 SMART ROUTE FIX ================= */

async function callResetRoutes(payload){
  const routes = [
    "/auth/reset",
    "/reset",
    "/reset-password",
    "/auth/reset-password"
  ];

  const backends = [];

  if(forcedBackend === "primary"){
    backends.push({name:"primary", url:PRIMARY_API});
  } else if(forcedBackend === "legacy"){
    backends.push({name:"legacy", url:LEGACY_API});
  } else {
    backends.push(
      {name:"primary", url:PRIMARY_API},
      {name:"legacy", url:LEGACY_API}
    );
  }

  for(const backend of backends){
    for(const path of routes){
      const res = await callApi(backend.url, path, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });

      if(res.ok){
        console.log("✅ RESET ROUTE:", backend.name, path);
        return { ...res, backend:backend.name, matchedPath:path };
      }

      // stop if not route problem
      if(res.status !== 404){
        return { ...res, backend:backend.name };
      }
    }
  }

  return { ok:false, status:404, data:{message:"Reset route not found"} };
}

/* ================= MAIN ================= */

async function resetPassword(){
  const pass = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if(!token){
    show("Invalid or missing token ❌");
    return;
  }

  if(pass.length < 8){
    show("Password must be at least 8 characters ❌");
    return;
  }

  if(pass !== confirm){
    show("Passwords do not match ❌");
    return;
  }

  btn.disabled = true;
  show("");

  const result = await callResetRoutes({
    token,
    password: pass
  });

  showBackend(result.backend);
  updateBackLink(result.backend);

  if(!result.ok){
    show(result.data?.message || "Reset failed ❌");
    btn.disabled = false;
    return;
  }

  show("Password updated successfully 🎉 Redirecting...", "success");

  setTimeout(()=>{
    window.location.href = buildIndexHref(email, result.backend || forcedBackend || "");
  },1500);

  btn.disabled = false;
}

/* ================= INIT ================= */

updateBackLink(forcedBackend);

if(forcedBackend === "primary" || forcedBackend === "legacy"){
  showBackend(forcedBackend);
}
</script>

</body>
</html>
